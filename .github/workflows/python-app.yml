name: SUTOM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Installation de Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install py2app
    - name: Compilation
      run: python setup.py py2app
    - name: Zip
      run: |
        cd dist
        zip -r SUTOM-macOS.zip main.app
    - name: Mise en ligne de l'application
      uses: actions/upload-artifact@v4
      with:
        name: sutom-macos
        path: dist/SUTOM-macOS.zip

  windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Installation de Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    - name: Compilation
      run: pyinstaller --onefile --add-data "assets/fonts;fonts" --add-data "src/lang;lang" src/main.py
    - name: Zip
      run: Compress-Archive -Path "dist/main.exe" -DestinationPath "dist/SUTOM-windows.zip" -Force
    - name: Mise en ligne de l'application
      uses: actions/upload-artifact@v4
      with:
        name: sutom-windows
        path: dist/SUTOM-windows.zip
    

  
  release:
    needs:
      - macos
      - windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Téléchargement
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sutom-windows/SUTOM-windows.zip
            sutom-macos/SUTOM-macOS.zip