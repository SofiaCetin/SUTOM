name: SUTOM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Installation de Python 3.9.6
      uses: actions/setup-python@v5
      with:
        python-version: "3.9.6"
    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install py2app
    - name: Compilation
      run: python setup.py py2app
    - name: Zip
      run: |
        cd dist
        zip -r SUTOM-macOS.zip main.app
    - name: Mise en ligne de l'application
      uses: actions/upload-artifact@v4
      with:
        name: sutom-macos
        path: dist/SUTOM-macOS.zip

  release:
    needs:
      - macos

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Téléchargement
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: sutom-macos/SUTOM-macOS.zip
  
